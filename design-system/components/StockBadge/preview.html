<meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300&display=swap">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-body);padding:20px}
  .lot{display:flex;align-items:center;gap:var(--space-2);font-size:11px;font-weight:200;color:var(--ink-body);margin-bottom:var(--space-3)}
  .dot{width:8px;height:8px;border-radius:var(--radius-blob)}
  .in{background:var(--status-success)} .out{background:var(--status-error)}
  .live{font-size:8px;letter-spacing:.2em;color:var(--promo-red);background:var(--promo-blue);padding:1px 4px;animation:bb-blink var(--blink) steps(2,start) infinite}
  @keyframes bb-blink{to{visibility:hidden}}
</style>
<div class="lot"><span class="dot in"></span>Yirgacheffe Kochere, washed</div>
<div class="lot"><span class="dot out"></span>Huila Pink Bourbon, natural</div>
<div class="lot"><span class="dot in"></span>Mandheling Grade 1</div>
<div class="lot"><span class="dot out"></span>Gesha Village Lot 22</div>
