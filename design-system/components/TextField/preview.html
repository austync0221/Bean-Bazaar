<!-- @dsCard group="Forms" height=170 subtitle="Default, invalid and valid inputs" -->
<meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300&display=swap">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-body);padding:20px}
  .f{display:block;width:240px;height:var(--target-min);margin-bottom:var(--space-2);padding:var(--space-1);
     border:1px solid var(--field-border);border-radius:var(--radius-none);background:var(--surface-card);
     font:200 10px var(--font-body);color:var(--ink-body);outline:none;box-sizing:border-box}
  .f::placeholder{color:var(--placeholder)}
  .f.err{border-color:var(--status-error);color:var(--status-error)}
  .ok{border-color:var(--status-success)}
  .note{font-size:8px;color:var(--ink-muted);font-weight:200;margin-top:6px}
</style>
<input class="f" placeholder="name">
<input class="f err" value="bean@lover">
<input class="f ok" value="2 tickets">
<div class="note">*required.</div>
