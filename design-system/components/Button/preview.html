<!-- @dsCard group="Actions" height=140 subtitle="Primary, secondary, disabled and icon buttons" -->
<meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Raleway:wght@200;300&display=swap">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-body);padding:20px}
  .row{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}
  .bb-btn{height:var(--target-min);padding:var(--space-1) 8px;background:var(--cta-bg);color:var(--cta-ink);
    font-size:10px;font-weight:300;letter-spacing:.2em;line-height:var(--target-min);box-sizing:border-box;
    border-radius:var(--radius-bean) 2px var(--radius-bean) 2px;cursor:pointer;outline:none;user-select:none}
  .bb-btn.dark{background:var(--band-dark);color:var(--band-ink)}
  .bb-btn.off{opacity:var(--disabled);cursor:default}
  .bb-icon{width:var(--target-min);height:var(--target-min);border-radius:var(--radius-blob);background:var(--cta-bg);
    display:inline-grid;place-items:center;cursor:pointer;font-size:9px;color:var(--cta-ink)}
  .cap{margin-top:14px;font-size:8px;color:var(--ink-muted);font-weight:200}
</style>
<div class="row">
  <div class="bb-btn" onclick="this.textContent='☕ ADDED'">GRAB BEANS</div>
  <div class="bb-btn dark" onclick="">SPILL THE TEA</div>
  <div class="bb-btn off">SOLD ☕-OUT</div>
  <div class="bb-icon" onclick="">♥</div>
  <div class="bb-icon" onclick="">⌂</div>
</div>
<div class="cap">Prices include roaster-direct shipping on orders over $40.</div>
