<!-- @dsCard height=300 -->
<meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap">
<style>
  html,body{margin:0;background:var(--surface-page)}
  .cv{position:relative;width:960px;height:300px;overflow:hidden;background:var(--surface-page)}
  svg{position:absolute;left:0;top:0}
  .band{fill:var(--band-dark)} .mint{fill:var(--cta-bg)} .blue{fill:var(--promo-blue)}
  .cara{fill:var(--ink-heading)} .tint{fill:var(--surface-card)}
  .bean{fill:var(--band-dark)} .bean2{fill:var(--cta-bg)}
  .seam{stroke:var(--ink-heading);stroke-width:2;fill:none;stroke-linecap:round}
  .seam2{stroke:var(--band-dark);stroke-width:2;fill:none;stroke-linecap:round}
  .txt{position:absolute;left:40px;bottom:32px;max-width:440px}
  .name{font-family:var(--font-display);font-size:104px;line-height:.95;color:var(--ink-heading);margin:0;letter-spacing:-.02em}
  .tag{font-family:var(--font-body);font-size:14px;color:var(--band-dark);margin-top:12px}
</style>
<div class="cv">
<!--
  blocks: band-dark tall slab 200×300 (bleeds top/bottom), cta-bg 160×150, ink-heading 160×150, surface-card 120×300 tint, promo-blue 80×60 accent (the flash-sale colour kept small).
  arrangement: one tall band-dark slab with satellites, stepped from x=500 to the right edge.
  pattern: literal motif, coffee beans: ellipses built from radius-blob with a centre seam; chosen because the brand names its own shapes "bean" (radius-bean, radius-blob).
  scales: 5px space-3 gaps between blocks; beans 36×24 at a 60px pitch; radius-blob for every bean.
-->
<svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
  <rect class="tint" x="500" y="0" width="120" height="300"/>
  <rect class="band" x="625" y="0" width="200" height="300"/>
  <rect class="mint" x="830" y="0" width="130" height="145"/>
  <rect class="cara" x="830" y="150" width="130" height="150"/>
  <rect class="blue" x="540" y="215" width="80" height="60"/>
  <g>
    <ellipse class="bean2" cx="680" cy="60" rx="18" ry="12" transform="rotate(-30 680 60)"/><path class="seam2" d="M668 66 q12 -6 24 -12"/>
    <ellipse class="bean2" cx="760" cy="120" rx="18" ry="12" transform="rotate(25 760 120)"/><path class="seam2" d="M748 114 q12 6 24 12"/>
    <ellipse class="bean2" cx="690" cy="180" rx="18" ry="12" transform="rotate(-15 690 180)"/><path class="seam2" d="M676 183 q14 -3 28 -6"/>
    <ellipse class="bean2" cx="770" cy="240" rx="18" ry="12" transform="rotate(40 770 240)"/><path class="seam2" d="M759 231 q11 9 22 18"/>
    <ellipse class="bean" cx="895" cy="72" rx="18" ry="12" transform="rotate(20 895 72)"/><path class="seam" d="M882 68 q13 4 26 8"/>
    <ellipse class="bean" cx="560" cy="80" rx="18" ry="12" transform="rotate(-35 560 80)"/><path class="seam" d="M548 87 q12 -7 24 -14"/>
    <ellipse class="bean" cx="565" cy="160" rx="18" ry="12" transform="rotate(15 565 160)"/><path class="seam" d="M552 157 q13 3 26 6"/>
  </g>
</svg>
<div class="txt">
  <p class="name">Bean<br>Bazaar</p>
  <div class="tag">Forty roasters. Two days. One very good cup.</div>
</div>
</div>
